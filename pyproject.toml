[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-domain-editing-and-panorama-stitching"
version = "0.1.0"
description = "Image blending (naive, Laplacian pyramid, Poisson) and feature-based panorama stitching, written from scratch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "jupyter",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = [
    "src/image_blending",
    "src/panorama",
]
omit = [
    "src/panorama/viz.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "cv2.imshow",
    "cv2.waitKey",
    "cv2.setMouseCallback",
    "plt.show",
]

[tool.coverage.html]
directory = "coverage_html"
title = "Computer Vision 2 - Test Coverage Report"
